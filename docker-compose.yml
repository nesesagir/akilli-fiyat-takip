services:
  postgres:
    image: postgres:16-alpine
    container_name: pricetracker-db
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pricetracker}
      POSTGRES_USER: ${POSTGRES_USER:-pricetracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pricetracker_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: pricetracker-api
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-pricetracker};Username=${POSTGRES_USER:-pricetracker};Password=${POSTGRES_PASSWORD:-pricetracker_dev}
      Cors__Origins__0: ${Cors__Origins__0:-http://localhost:3000}
      Cors__Origins__1: ${Cors__Origins__1:-http://localhost:3001}
      Hangfire__Enabled: ${Hangfire__Enabled:-false}
      Hangfire__Cron: ${Hangfire__Cron:-*/30 * * * *}
      PriceCheck__Enabled: ${PriceCheck__Enabled:-true}
      PriceCheck__IntervalMinutes: ${PriceCheck__IntervalMinutes:-30}
      Email__Enabled: ${Email__Enabled:-false}
      Email__Host: ${Email__Host:-smtp.gmail.com}
      Email__Port: ${Email__Port:-587}
      Email__UseSsl: ${Email__UseSsl:-true}
      Email__Username: ${Email__Username:-}
      Email__Password: ${Email__Password:-}
      Email__FromAddress: ${Email__FromAddress:-}
      Email__FromName: ${Email__FromName:-Akıllı Fiyat Takip}
      Database__ApplyMigrationsOnStartup: ${Database__ApplyMigrationsOnStartup:-true}
      Swagger__Enabled: ${Swagger__Enabled:-true}
      Admin__Email: ${Admin__Email:-admin@example.com}
      Admin__Password: ${Admin__Password:-ChangeMeAdmin1!}
      Admin__DisplayName: ${Admin__DisplayName:-Admin}
      Admin__ResetPasswordOnStartup: ${Admin__ResetPasswordOnStartup:-false}
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
    ports:
      - "5080:8080"

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5080}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3001}
    container_name: pricetracker-web
    depends_on:
      - api
    ports:
      - "3001:3000"

volumes:
  postgres_data:
